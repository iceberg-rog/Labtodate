# --- BUG-015: upstream keepalive so concurrent _rsc prefetch bursts reuse
# connections to the single Next.js standalone process instead of opening a
# fresh upstream connection per request (which exhausted it -> nginx 503).
# `map` keeps websocket upgrades working while letting normal HTTP reuse keepalive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

upstream lab2date_web {
    server 127.0.0.1:3100;
    keepalive 64;
}

# Per-IP rate limiting, keyed on the real TCP peer ($binary_remote_addr) — NOT
# the spoofable X-Forwarded-For. A flood (thousands of req/s) is dropped with
# 429 so it can't saturate the single Next.js process + Postgres, while a real
# user's page-load burst is absorbed by `burst`. Static assets are immutable +
# browser-cached, so a normal session stays well under the limit.
limit_req_zone  $binary_remote_addr zone=perip_req:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name lab2date.com www.lab2date.com _;

    ssl_certificate     /etc/nginx/ssl/lab2date.crt;
    ssl_certificate_key /etc/nginx/ssl/lab2date.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
add_header X-Content-Type-Options "nosniff" always;    add_header X-Frame-Options "SAMEORIGIN" always;    add_header Referrer-Policy "strict-origin-when-cross-origin" always;    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Never expose bucket listings or the private prefixes (receipts, support
    # attachments) on the public origin; the app streams those through its
    # auth-gated /api/order-proof and /api/support-attachment proxies.
    location ~ ^/media/[^/]*/?$ { return 404; }
    location ~ ^/media/[^/]+/(?:support-att|order-proofs)/ { return 404; }

    # Self-hosted media (MinIO) — no external dependency
    location /media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_intercept_errors off;
        add_header Cache-Control "public, max-age=2592000";
        # User uploads are served from the site's own origin. An add_header here
        # drops every server-level header, so the security headers are repeated,
        # and the sandbox CSP stops any stored file (SVG/HTML) from running
        # script on this origin if one is ever opened directly.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        limit_req  zone=perip_req burst=100 nodelay;
        limit_conn perip_conn 50;
        proxy_pass http://lab2date_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
